name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECRET_KEY: github-actions-test-key
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m babel.messages.frontend compile -d locale -D django
      - run: git diff --exit-code -- locale
      - run: python manage.py test

  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest motor/tests -q

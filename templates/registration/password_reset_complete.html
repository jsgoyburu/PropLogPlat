{% extends "base.html" %}
{% load ui_i18n %}

{% block title %}{% ui 'password_updated' %} — {{ config_sitio.nombre_sitio }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 420px;">
  <div class="card" style="margin-top: 3rem;">
    <h2 style="margin-top: 0; margin-bottom: 0.75rem;">{% ui 'ready' %}</h2>

    <p style="margin-bottom: 1.5rem;">
      {% ui 'password_updated_body' %}
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary"
       style="display: block; text-align: center;">{% ui 'log_in' %}</a>
  </div>
</div>
{% endblock %}

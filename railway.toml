[build]
builder = "RAILPACK"

[deploy]
preDeployCommand = ["python manage.py migrate && python manage.py crear_admin_inicial"]
startCommand = "gunicorn logica_ipc.wsgi --bind 0.0.0.0:$PORT --access-logfile - --error-logfile -"
healthcheckPath = "/healthz/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
